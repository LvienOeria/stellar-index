[project]
name = "stellar-index"
version = "0.1.0"
description = "A citation-grounded deep-reading assistant for public-domain sci-fi novels; compares RAG, 1M-token long context, and self-routing retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LvienOeria" }]
keywords = ["deepseek", "ai-agent", "rag", "long-context", "citation", "sci-fi"]
dependencies = [
  "openai>=1.50",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
retrieval = [
  "rank-bm25>=0.2.2",
  "sentence-transformers>=5.0",
  "lancedb>=0.30",
  "spacy>=3.7",
]
ui = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
stellar-index = "stellarindex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stellarindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
