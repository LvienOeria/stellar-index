name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install -e '.[dev]'
      - run: uv run pytest -q
      - run: uv run stellar-index build --fixtures
      - run: uv run stellar-index eval --fixtures --retrieval-only
